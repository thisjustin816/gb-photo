name: Build and Release Photo! DX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project source
        uses: actions/checkout@v4
        with:
          # Keep branch-name strings from changing the ROM layout between builds.
          ref: ${{ github.sha }}

      - name: Install build dependencies
        run: |
          curl --fail --location https://github.com/gbdk-2020/gbdk-2020/releases/download/gbdk-next/gbdk-linux64.tar.gz -o gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz
          echo "GBDK_HOME=$(pwd)/gbdk/" >> "$GITHUB_ENV"
          python -m pip install --upgrade Pillow

      - name: Build the project
        run: |
          make gbc
        env:
          GBDK_HOME: ${{ env.GBDK_HOME }}

      - name: Package Photo! DX
        run: |
          version=$(cat version)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo '::error::Release tag must match the in-ROM version.'
            exit 1
          fi
          for rom in build/gbc/photo.gbc; do
            if [[ $(stat -c %s "$rom") -ne 131072 ]]; then
              echo "::error file=$rom::ROM must be 128 KiB to preserve the flash-roll layout."
              exit 1
            fi
            md5sum "$rom"
          done
          mkdir -p build/release
          cp build/gbc/photo.gbc "build/release/Photo! DX [v$version].gbc"
          python -c 'import pathlib, sys, zipfile; p = pathlib.Path(sys.argv[1]); z = zipfile.ZipFile(sys.argv[2], "w", zipfile.ZIP_DEFLATED); z.write(p, p.name); z.close()' \
            "build/release/Photo! DX [v$version].gbc" "build/release/Photo.DX.v$version.zip"

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: photo-dx
          path: build/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Retain matching debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: photo-dx-symbols
          path: build/gbc/photo.noi
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the ROM package
        uses: actions/download-artifact@v8
        with:
          name: photo-dx
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # GitHub normalizes direct asset names; the ZIP keeps the ROM's exact filename.
          asset="release/Photo.DX.${RELEASE_TAG}.gbc"
          cp release/*.gbc "$asset"
          args=("$RELEASE_TAG" "$asset#Photo! DX [$RELEASE_TAG].gbc" release/*.zip
            --verify-tag --title "Photo! DX $RELEASE_TAG" --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
